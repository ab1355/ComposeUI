<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComposeUI - Dashboard Builder</title>
    <link rel="stylesheet" href="/magnet.css">
    <link rel="icon" href="/assets/icon.png" type="image/x-icon" />
    <script src="https://kit.fontawesome.com/ca8fcf3462.js" crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        .dashboard-header {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .dashboard-header h1 {
            margin: 0 0 0.5rem 0;
            color: #333;
        }

        .dashboard-header p {
            margin: 0;
            color: #666;
        }

        .compose-dashboard {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .compose-component {
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .control-panel {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .control-panel h3 {
            margin-top: 0;
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .emoji-login {
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            margin: 2rem auto;
        }

        .emoji-input {
            font-size: 2rem;
            text-align: center;
            padding: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 0.5rem;
            width: 100%;
            margin: 1rem 0;
        }

        .emoji-suggestion {
            background: #f0f0f0;
            padding: 1rem;
            border-radius: 0.5rem;
            text-align: center;
            font-size: 1.5rem;
            margin: 1rem 0;
            cursor: pointer;
            transition: background 0.2s;
        }

        .emoji-suggestion:hover {
            background: #e0e0e0;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            background: white;
            border-radius: 0.5rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-header">
            <h1>🎨 ComposeUI - Dashboard Builder</h1>
            <p>Create instant dashboards with composable components and emoji-based security</p>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="emoji-login">
            <h2 style="text-align: center; margin-top: 0;">🔐 Emoji Security Login</h2>
            <p style="text-align: center; color: #666;">
                Enter your emoji pattern to access the dashboard builder
            </p>
            <input 
                type="text" 
                id="emoji-pattern-input" 
                class="emoji-input" 
                placeholder="Enter emoji pattern (e.g., 🔐🌟🎯)"
            />
            <div class="button-group" style="justify-content: center;">
                <button class="btn primary-btn" onclick="login()">
                    🚀 Login
                </button>
                <button class="btn secondary-btn" onclick="showSuggestion()">
                    💡 Get Suggestion
                </button>
            </div>
            <div id="emoji-suggestion" style="display: none;"></div>
            <div style="margin-top: 1.5rem; padding: 1rem; background: #f8f9fa; border-radius: 0.5rem;">
                <p style="margin: 0; font-size: 0.9rem; color: #666;">
                    <strong>Demo credentials:</strong><br>
                    Username: demo<br>
                    Pattern: 🔐🌟🎯🚀
                </p>
            </div>
        </div>

        <!-- Dashboard Section (hidden until login) -->
        <div id="dashboard-section" style="display: none;">
            <div class="status-bar">
                <div id="security-status"></div>
                <button class="btn error-btn" onclick="logout()">
                    👋 Logout
                </button>
            </div>

            <div class="control-panel">
                <h3>⚡ Quick Actions</h3>
                <div class="button-group">
                    <button class="btn primary-btn" onclick="addStatWidget()">
                        📊 Add Stat Widget
                    </button>
                    <button class="btn secondary-btn" onclick="addAlert()">
                        📢 Add Alert
                    </button>
                    <button class="btn success-btn" onclick="addCard()">
                        🎴 Add Card
                    </button>
                    <button class="btn outline-primary-btn" onclick="createAnalyticsDashboard()">
                        📈 Analytics Dashboard
                    </button>
                    <button class="btn outline-secondary-btn" onclick="clearDashboard()">
                        🗑️ Clear Dashboard
                    </button>
                </div>
            </div>

            <div id="main-dashboard"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/components/compose.js"></script>
    <script src="/components/emoji-security.js"></script>
    <script src="/components/component-registry.js"></script>
    <script src="/components/dashboard-builder.js"></script>
</body>
</html>
